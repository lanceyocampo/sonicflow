name: Lint, test, and deploy SonicFlow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    name: Lint JavaScript code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked development dependencies
        run: npm ci

      - name: Run ESLint quality gate
        run: npm run lint

  test:
    name: Run Jest unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked development dependencies
        run: npm ci

      - name: Run Jest test suite
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package static runtime files
        run: |
          mkdir -p _site
          cp index.html style.css script.js greeting.js _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy packaged site
        id: deployment
        uses: actions/deploy-pages@v4
